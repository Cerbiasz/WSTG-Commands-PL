    expected: true
    severity: medium
    notes: "Cookies bez HttpOnly flag"

  # WSTG-ATHZ
  WSTG-ATHZ-04:
    expected: true
    severity: high
    notes: "IDOR na /api/Users/{id} (jeśli admin endpoints exposed)"

