# ============================================================================
# expected-findings.yaml — oczekiwane podatności per testowa aplikacja
# ============================================================================
#
# Lista podatności które WSTG Suite POWINNA wykryć na każdej z testowych aplikacji.
# Używany przez run-validation.sh do oceny detection rate.
#
# Format:
#   <app_name>:
#     <wstg_test_id>:
#       expected: true|false
#       severity: critical|high|medium|low|info
#       notes: ...
# ============================================================================

juiceshop:
  base_url: "http://localhost:3000"

  # WSTG-INFO
  WSTG-INFO-02:
