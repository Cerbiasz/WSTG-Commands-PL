    severity: medium
    notes: "Hidden API endpoints w JS bundles"

  WSTG-INFO-08:
    expected: true
    severity: info
    notes: "Angular framework markers"

  # WSTG-CONF
  WSTG-CONF-12:
    expected: true
    severity: medium
    notes: "Brak proper CSP"

  WSTG-CONF-14:
    expected: true
    severity: medium
    notes: "Brak X-Content-Type-Options, Referrer-Policy, etc."

  # WSTG-INPV
  WSTG-INPV-01:
    expected: true
    severity: high
    notes: "Reflected XSS w search functionality"

  WSTG-INPV-05:
    expected: true
