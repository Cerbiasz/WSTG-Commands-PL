# ============================================================================
# How to use:
#
# 1. Start docker-compose: `docker-compose up -d`
# 2. Wait for services healthy (~ 1 min)
# 3. Run validation: `./run-validation.sh`
# 4. Compare detected findings vs expected
#
# Detection rate score = (detected / expected) * 100%
# Target: >= 80% per application
# ============================================================================
