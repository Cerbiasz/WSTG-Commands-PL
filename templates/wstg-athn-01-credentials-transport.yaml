# ============================================================================
# WSTG-ATHN-01: Credentials Transported over Encrypted Channel (Universal)
# ============================================================================
#
# Review status: NOWY
# Reviewer: Claude Code (Opus 4.7)
# Review date: 2026-05-01
#
# Coverage: detekcja login form / API endpoints akceptujących credentials
# przez HTTP (nie HTTPS). Krytyczna luka — credentials w plaintext na wire.
# Cross-ref WSTG-CRYP-03.
# ============================================================================

id: wstg-athn-01-credentials-transport

info:
  name: "WSTG-ATHN-01: Credentials Transport via HTTPS (Universal)"
  author: pentest-team
  severity: high
  description: |
    Wykrywa login forms i API endpoints akceptujące credentials przez HTTP
    (cleartext). Cross-ref WSTG-CRYP-03 - tu focus na auth-specific endpoints
    (login, registration, password reset, MFA enrollment).
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/04-Authentication_Testing/01-Testing_for_Credentials_Transported_over_an_Encrypted_Channel
    - https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
  classification:
    cwe-id: CWE-319
    cvss-metrics: CVSS:3.1/AV:N/AC:H/PR:N/UI:R/S:C/C:H/I:H/A:N
    cvss-score: 8.0
  tags: dast,wstg,wstg-v42-athn-01,plaintext,authentication,burp-history

variables:
  auth_token: ""
  session_cookie: ""

http:
  - method: GET
    path:
      - "{{BaseURL}}/"

    matchers-condition: or
    matchers:
      # Login form na HTTP page (action attribute http:// lub strona już HTTP)
      - type: dsl
        name: login-form-on-http-page
        dsl:
          - "regex(\"^http://\", BaseURL)"
          - "regex(\"(?i)<form[^>]*>[\\\\s\\\\S]*?<input[^>]*type=[\\\"']password\", body)"
        condition: and

      # Login form action HTTP (nawet jeśli strona HTTPS)
      - type: regex
        part: body
        name: login-form-action-http
        regex:
          - "(?i)<form[^>]*action=[\"']http://[^\"']*[\"'][^>]*>[\\s\\S]*?<input[^>]*type=[\"']password"

      # API auth endpoint via HTTP
      - type: dsl
        name: auth-api-via-http
        dsl:
          - "regex(\"^http://\", BaseURL)"
          - "regex(\"(?i)/(auth|login|signin|api/auth|oauth/token|api/login)\", path)"
        condition: and

      # MFA challenge na HTTP
      - type: dsl
        name: mfa-challenge-on-http
        dsl:
          - "regex(\"^http://\", BaseURL)"
          - "regex(\"(?i)(otp|2fa|mfa|totp|authenticator)\", body)"
        condition: and

      # Basic Auth challenge na HTTP
      - type: dsl
        name: basic-auth-on-http
        dsl:
          - "regex(\"^http://\", BaseURL)"
          - "regex(\"(?i)www-authenticate:\\\\s*Basic\", header)"
        condition: and

# ============================================================================
# Known limitations:
# - Wymaga że BaseURL zawiera HTTP endpoints. HTTPS-only target nie testuje.
# - Cross-ref WSTG-CRYP-03 dla pełnego pokrycia transport security.
# ============================================================================
