# ============================================================================
# WSTG-ATHN-02: Testing for Default Credentials (Universal)
# ============================================================================
#
# Review status: NOWY
# Reviewer: Claude Code (Opus 4.7)
# Review date: 2026-05-01
#
# Coverage: pasywna detekcja default credentials w widocznych miejscach
# (komentarze HTML, JS bundle, error messages). Aktywne testowanie
# default-logins delegowane do oficjalnych nuclei-templates.
# ============================================================================

id: wstg-athn-02-default-credentials

info:
  name: "WSTG-ATHN-02: Default Credentials Markers (Universal)"
  author: pentest-team
  severity: high
  description: |
    Pasywnie wykrywa wskazówki default credentials w response: komentarze
    HTML z "default password", JS bundle z hardcoded credentials, login
    page z prefilled credentials, error messages ujawniające defaults.
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/04-Authentication_Testing/02-Testing_for_Default_Credentials
    - https://github.com/projectdiscovery/nuclei-templates/tree/main/http/default-logins
  classification:
    cwe-id: CWE-521,CWE-1392
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H
    cvss-score: 9.8
  tags: dast,wstg,wstg-v42-athn-02,default-creds,authentication,burp-history

variables:
  auth_token: ""
  session_cookie: ""

http:
  - method: GET
    path:
      - "{{BaseURL}}/"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/admin/login"
    stop-at-first-match: false

    matchers-condition: or
    matchers:
      # Komentarze HTML z hint na default creds
      - type: regex
        part: body
        name: html-comment-default-creds
        regex:
          - "(?is)<!--[^>]*?(default\\s+(?:password|user|login)|admin/admin|root/root|test/test)[^>]*?-->"

      # Prefilled login form z default values
      - type: regex
        part: body
        name: prefilled-default-login
        regex:
          - "(?i)<input[^>]*name=[\"'](?:user(?:name)?|login|email)[\"'][^>]*value=[\"'](?:admin|root|administrator|test|user|demo)[\"']"

      # Document mentions default password
      - type: regex
        part: body
        name: documentation-default-password
        regex:
          - "(?i)default\\s+password[\\s:]*['\"]?(?:admin|password|password123|admin123|changeme|root|123456)['\"]?"
          - "(?i)default\\s+credentials?[\\s:]*['\"]?[a-z]+/[a-z0-9]+['\"]?"

      # JS bundle z hardcoded credentials (rare ale destrukcyjne)
      - type: regex
        part: body
        name: js-hardcoded-credentials
        regex:
          - "(?i)(?:password|passwd|pwd)\\s*[:=]\\s*[\"'](?:admin|password|password123|admin123|changeme|root|test123)[\"']"

      # Login page z visible credentials hint
      - type: regex
        part: body
        name: visible-credentials-hint
        regex:
          - "(?i)(?:try|use|hint)[^<>]{0,30}(?:admin|root|test)[/:]\\s*(?:admin|password|test|123456)"

# ============================================================================
# Known limitations:
# - Pasywna detekcja - active default-login testing delegowane do
#   nuclei-templates http/default-logins/* (Tomcat, Jenkins, JBoss, etc.)
# - Wykrywa tylko widoczne markery - aplikacje z properly hidden defaults
#   nie są pokrywane (manual brute-force z SecLists/Passwords/Default-Credentials)
# ============================================================================
