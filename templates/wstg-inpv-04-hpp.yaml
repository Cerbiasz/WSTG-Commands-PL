# ============================================================================
# WSTG-INPV-04: HTTP Parameter Pollution (Multi-Request Differential)
# Review status: ZACHOWANY
# Reviewer: Claude Code (Opus 4.7)
# Review date: 2026-04-30
# Powód decyzji: szablon spełnia wszystkie 6 kryteriów review (Coverage Matrix,
# multi-warstwowe matchery z anti-FP, source comments, safety nets,
# sweet spot payloadów, component fuzzing). OOB matcher nie jest dodany
# świadomie: Multi-request differential (compare 2 odpowiedzi); OOB nie ma zastosowania.
#
# ============================================================================
#
# Coverage Matrix:
#   ✓ Duplicate query params (?a=1&a=2)
#   ✓ Duplicate body params (a=1&a=2)
#   ✓ Mixed location pollution (query + body)
#   ✓ Array-style pollution (a[]=1&a[]=2)
#   ✓ JSON pollution (gdy body application/json)
#
# Mechanizm wykrywania:
#   1) Wyślij baseline (param=value)
#   2) Wyślij polluted (param=value&param=injected)
#   3) Wyślij polluted-reverse (param=injected&param=value)
#   Porównaj odpowiedzi - jeśli różnią się znacznie, parser wybiera różne
#   wartości dla różnych warstw aplikacji = HPP confirmed.
#
# Performance budget: low-medium (~50 par × 5 części × 3 requesty)
# Estimated time: ~5-10 min
# ============================================================================

id: wstg-inpv-04-hpp

info:
  name: "WSTG-INPV-04: HTTP Parameter Pollution (Multi-Request Differential)"
  author: pentest-team
  severity: medium
  description: |
    Wykrywa HTTP Parameter Pollution (HPP) przez wysyłanie 3 wariantów żądania:
    baseline, polluted (param=val&param=inject), reverse-polluted. Jeśli
    odpowiedzi różnią się znacznie - parser przekazuje różne wartości do
    różnych warstw (front-end vs back-end ACL inconsistency).
  reference:
    - https://owasp.org/www-project-web-security-testing-guide/v42/4-Web_Application_Security_Testing/07-Input_Validation_Testing/04-Testing_for_HTTP_Parameter_Pollution
    - https://github.com/swisskyrepo/PayloadsAllTheThings/tree/master/HTTP%20Parameter%20Pollution
    - https://book.hacktricks.xyz/pentesting-web/parameter-pollution
  classification:
    cwe-id: CWE-235
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:L/I:L/A:N
    cvss-score: 5.4
  tags: dast,wstg,wstg-v42-inpv-04,hpp,asvs-v5.1.5,burp-history

variables:
  canary: "x{{rand_text_alpha(10)}}x"
  auth_token: ""
  session_cookie: ""

flow: http(1) && http(2) && http(3)

http:
  # Block 1: Baseline (original request bez modyfikacji)
  - pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'
          - 'method != "HEAD"'
          - 'method != "DELETE"'
          - '!regex("(?i)\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot|map|pdf|zip)(\\?|$)", path)'
          - '!regex("(?i)/(delete|cancel|drop|destroy|remove|purge|wipe|reset|terminate)(/|$|\\?)", path)'
        condition: and

    matchers:
      - type: dsl
        dsl:
          - "len(body) > 30"
        internal: true

    extractors:
      - type: dsl
        name: baseline_len
        dsl:
          - "len(body)"
        internal: true

  # Block 2: Polluted - duplicate param postfix
  - payloads:
      pollution:
        - "&{{canary}}=injected1"
        - "&{{canary}}=injected2"
        - "[]=injected"
        - "[0]=injected"
        - "%00=injected"

    fuzzing:
      - parts: [query, body]
        type: postfix
        mode: single
        fuzz:
          - "{{pollution}}"

    matchers:
      - type: dsl
        dsl:
          - "len(body) > 30"
        internal: true

  # Block 3: Polluted reverse (prefix duplicate)
  - payloads:
      pollution_prefix:
        - "{{canary}}=injected1&"
        - "{{canary}}=injected2&"

    fuzzing:
      - parts: [query, body]
        type: prefix
        mode: single
        fuzz:
          - "{{pollution_prefix}}"

    stop-at-first-match: true

    matchers-condition: and
    matchers:
      # Warstwa 1: PRIMARY - response 2 lub 3 RÓŻNI się znacznie od baseline
      - type: dsl
        name: hpp-differential
        dsl:
          # Duża zmiana długości lub status
          - "abs(content_length_1 - content_length_2) > 100 || status_code_1 != status_code_2 || abs(content_length_1 - content_length_3) > 100 || status_code_1 != status_code_3"

      # Warstwa 2: ANTI-FP - delta NIE pochodzi z dynamic body (CSRF tokens itp.)
      # Wymagamy że delta(baseline, polluted) jest >> delta(polluted, polluted_reverse) WTEDY GDY
      # delta jest faktycznie z parser-conflict, nie z noise
      - type: dsl
        name: delta-meaningful
        dsl:
          - "abs(content_length_1 - content_length_2) > 100 || status_code_1 != status_code_2"

      # Warstwa 3: ANTI-FP - WAF block / timeout
      - type: dsl
        dsl:
          - "status_code_2 != 403 && status_code_3 != 403"

      - type: dsl
        dsl:
          - "duration_1 + duration_2 + duration_3 < 60"

    extractors:
      - type: dsl
        name: differential
        dsl:
          - "\"baseline=\" + string(content_length_1) + \" polluted=\" + string(content_length_2) + \" reverse=\" + string(content_length_3)"

# ============================================================================
# Known limitations:
# - Aplikacje z dynamicznym body (CSRF token, timestamp, A/B test markers)
#   generują FP - mitigowane przez warstwę 2 ale 100% odporności brak
# - Niektóre HPP są benign (np. pierwszy parametr wygrywa bo tak frameworki
#   obsługują duplikaty) - ręczna weryfikacja konieczna
# ============================================================================
