    # ========================================================================
    # Fuzzing config: wszystkie 5 części żądania w trybie single (jeden parametr
    # na raz - dokładniej, ale więcej requestów). URL-encoding wartości żeby
    # niezniszczyć struktury żądania.
    # ========================================================================
    fuzzing:
      - parts:
          - query
          - body
          - cookie
          - path
          - header
        type: postfix      # postfix = doklej do oryginalnej wartości (zachowuje shape)
        mode: single       # single = jeden parametr na raz (mniej noise)
        # Filtr keys: nie fuzzujemy headerów typowych dla auth/CSRF/cache
        # bo to: (1) niszczy auth, (2) cache headery zwykle nie są reflected
        fuzz:
          - "{{url_encode(xss)}}"

    stop-at-first-match: true

    # ========================================================================
    # Matchery 3-warstwowe:
    # 1) PRIMARY: kanarek odbity w niebezpiecznym kontekście (regex z literal `<`,
    #    `javascript:`, event-handler, attr breakout). Sam fakt wystąpienia
    #    canary w body to za mało - musi być w niebezpiecznym kontekście.
    # 2) SECONDARY: Content-Type wskazuje renderowalny format (text/html, svg).
    #    JSON odpowiedzi które odbijają canary nie egzekwują XSS w przeglądarce
    #    (chyba że MIME sniffing - poza skalą).
    # 3) ANTI-FP: nie WAF-block (403 z keyword "blocked"), nie escape'd canary,
    #    nie status 5xx z generycznym error page.
    # ========================================================================
    matchers-condition: and
    matchers:
      # Warstwa 1: Primary signal - kanarek w niebezpiecznym kontekście HTML/JS
      # Wzorce: canary w opening tag / event handler / javascript: URI / inside <script>
      - type: regex
        part: body
        name: dangerous-reflection
        regex:
          # canary jako fragment opening tag <CANARY>, <foo CANARY=>, <foo bar=CANARY
          - "<[^>\\s]*{{canary}}"
          - "<[^>]+\\s+[^=>\\s]*{{canary}}"
          # canary w atrybucie event handler on*=
          - "(?i)on\\w+\\s*=\\s*[\"']?[^\"']*{{canary}}"
          # canary w javascript: / data: URI w atrybucie href/src/action
          - "(?i)(href|src|action|formaction|data|poster|background)\\s*=\\s*[\"']?(javascript|data|vbscript)[^\"'>]*{{canary}}"
          # canary wewnątrz <script>...{{canary}}...</script> jako string
          - "(?is)<script[^>]*>[^<]*{{canary}}"
          # canary w style/expression
          - "(?i)style\\s*=\\s*[\"'][^\"']*expression\\([^)]*{{canary}}"
        condition: or

      # Warstwa 2: Secondary - Content-Type renderable LUB JSON (SPA reflection)
      # JSON odpowiedzi z odbiciem canary w niebezpiecznym kontekście to nadal
      # sygnał — może być wykorzystane przez frontend który renderuje JSON jako HTML
      # (typowe w SPA). Wykluczamy tylko czyste binarne typy.
      - type: regex
        part: header
        name: renderable-or-json
        regex:
          - "(?i)content-type:\\s*(text/html|image/svg|application/xhtml|application/json|text/json|text/plain|application/javascript|text/javascript)"

      # Warstwa 3a: Anti-FP - escape detection
      # Jeśli body zawiera ESCAPE'd kanarek (&lt;CANARY) i NIE zawiera surowego,
      # to jest properly sanitized - negative match.
      # UWAGA: tu sprawdzamy czy NIE występuje wzorzec w pełni-escape'd. Jeśli
      # występuje też surowy (warstwa 1) to mamy match. Ale gdy TYLKO escape'd
      # to warstwa 1 nie złapie więc to redundantne. Zostawiam dla pewności.
      - type: regex
        part: body
        name: not-fully-escaped
        negative: true
        regex:
          # Same escape'd warianty - blokujemy jeśli to JEDYNA forma
          # (warstwa 1 gwarantuje że surowy też wystąpił - gdyby nie, ten check by FP'd)
          # więc sprawdzamy czy nie ma keyword'ów sanityzatora typu "[FILTERED]"
          - "(?i)(\\[filtered\\]|<sanitized>|removed by waf|blocked by security)\\s*{{canary}}"

      # Warstwa 3b: Anti-FP - WAF block detection
      # Status 403 + body z markerami WAF = block, nie odbicie
      - type: dsl
        name: not-waf-block
        dsl:
          - 'status_code != 403 || (status_code == 403 && !contains(tolower(body), "blocked") && !contains(tolower(body), "forbidden"))'

      # Warstwa 3c: Anti-FP - Timeout protection
      - type: dsl
        name: response-time-sane
        dsl:
          - "duration < 30"

      # Warstwa 3d: Anti-FP - CSRF rejection detection (negative)
      # Jeśli odpowiedź to typowy CSRF error, nie traktuj jako XSS
      - type: regex
        part: body
        name: not-csrf-rejection
        negative: true
        regex:
          - "(?i)(invalid csrf token|csrf token mismatch|x-csrf-token.*invalid|forbidden.*csrf)"

      # Warstwa 3e: Anti-FP - Auth rejection (401 z auth-related keywordami)
      - type: dsl
        name: not-auth-rejection
        dsl:
          - 'status_code != 401'

    # ========================================================================
    # Extractors: dla raportu deweloperzy chcą widzieć dokładny kontekst odbicia
    # ========================================================================
    extractors:
      - type: regex
        name: reflected-context
        part: body
        group: 0
        regex:
          - ".{0,80}{{canary}}.{0,80}"

      - type: dsl
        name: detected-context
        dsl:
          - "regex(\"<[^>]*\" + canary, body) ? \"html-tag\" : \"\""
          - "regex(\"on\\\\w+\\\\s*=[^>]*\" + canary, body) ? \"event-handler\" : \"\""
          - "regex(\"javascript:[^>]*\" + canary, body) ? \"js-uri\" : \"\""
          - "regex(\"<script[^>]*>[^<]*\" + canary, body) ? \"js-string\" : \"\""

  # ==========================================================================
  # DRUGI BLOCK: Blind XSS via OAST resource-load detection
  # Wykrywa scenariusze gdy payload ładuje zewnętrzny zasób (img/script/iframe
  # src=//interactsh) - jeśli payload zostanie wyrenderowany w przeglądarce
  # ofiary lub serwer doda go do template renderowanego po stronie klienta,
  # zasób zostanie pobrany. Callback do interactsh = evidence wykonania.
  # ==========================================================================
  - pre-condition:
      - type: dsl
        dsl:
          - 'method != "OPTIONS"'
          - 'method != "HEAD"'
          - 'method != "DELETE"'
          - '!regex("(?i)\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf|eot|map|pdf|zip|tar|gz|mp4|webm)(\\?|$)", path)'
          - '!regex("(?i)/(delete|cancel|drop|destroy|remove|purge|wipe|reset|terminate|logout|signout)(/|$|\\?)", path)'
        condition: and

    payloads:
      xss_oob:
        - "<img src=//{{interactsh-url}}/{{canary}}>"
        - "<script src=//{{interactsh-url}}/{{canary}}.js></script>"
        - "<link rel=stylesheet href=//{{interactsh-url}}/{{canary}}.css>"
        - "<iframe src=//{{interactsh-url}}/{{canary}}></iframe>"
        - "<video><source src=//{{interactsh-url}}/{{canary}}.mp4></video>"
        - "<audio src=//{{interactsh-url}}/{{canary}}.mp3></audio>"
        - "<object data=//{{interactsh-url}}/{{canary}}></object>"
        - "<embed src=//{{interactsh-url}}/{{canary}}>"
        - "<svg><image href=//{{interactsh-url}}/{{canary}}/></svg>"

    fuzzing:
      - parts: [query, body, cookie, path, header]
        type: postfix
        mode: single
        fuzz:
          - "{{url_encode(xss_oob)}}"

    stop-at-first-match: true
    matchers:
      - type: word
        part: interactsh_protocol
        name: oob-callback-received
        words:
          - "dns"
          - "http"
        condition: or

# ============================================================================
# Known limitations:
# - Nie wykrywa DOM-based XSS (wymaga headless browsera)
# - Nie wykrywa Stored XSS (POST → GET mapping wymaga ręcznej konfiguracji)
# - Nie wykrywa mXSS (mutation w DOM)
